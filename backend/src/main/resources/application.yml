spring:
  application:
    name: looply-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8081}

app:
  voice:
    storage-path: ${VOICE_STORAGE_PATH:./data/voice}
  image:
    storage-path: ${IMAGE_STORAGE_PATH:./data/images}
  security:
    jwt-secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT2H}

logging:
  level:
    org.springframework.security: INFO
