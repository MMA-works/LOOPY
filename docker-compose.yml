services:
  postgres:
    image: postgres:17-alpine
    container_name: looply-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-looply}
      POSTGRES_USER: ${POSTGRES_USER:-looply}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment or .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - looply_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  looply_postgres_data:
