name: looply
description: An original, messaging-inspired Flutter MVP.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: 9.2.4
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: ^1.2.1
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  record: ^7.1.1
  stomp_dart_client: ^3.0.1
  uuid: ^4.6.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
